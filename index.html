<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTBA Rehearsal Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">
    <header class="player-header">
      <h1>GTBA Rehearsal</h1>
      <p id="current-title">Select a track to start</p>
      
      <audio id="audio-player" controls preload="metadata">
        <source id="audio-source" src="" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </header>

    <ul class="playlist" id="playlist">
      <!-- Track items will be populated by JavaScript -->
    </ul>
  </div>

  <script>
    const tracks = [
      { title: "01 Eyes", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/01%20Eyes.mp3" },
      { title: "02 Loose Lucy", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/02%20Loose%20Lucy.mp3" },
      { title: "02 Ship Of Fools", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/02%20Ship%20Of%20Fools.mp3" },
      { title: "03 Loose Lucy V2", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/03%20Loose%20Lucy%20V2.mp3" },
      { title: "04 Crazy Fingers", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/04%20Crazy%20Fingers.mp3" },
      { title: "05 Beat It on Down", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/05%20Beat%20It%20on%20Down.mp3" },
      { title: "06 Beat it on Down V2", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/06%20Beat%20it%20on%20Down%20V2.mp3" },
      { title: "07 Man Smart Woman Smarter", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/07%20Man%20Smart%20Woman%20Smarter.mp3" },
      { title: "08 Music Never Stopped", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/08%20Music%20Never%20Stopped.mp3" },
      { title: "09 Playin in the band", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/09%20Playin%20in%20the%20band.mp3" },
      { title: "10 Playin in the Band 2", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/10%20Playin%20in%20the%20Band%202.mp3" },
      { title: "11 ONe More Saturday Night", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/11%20ONe%20More%20Saturday%20Night.mp3" },
      { title: "12 Deal", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/12%20Deal.mp3" },
      { title: "13 Friend Of The Devil", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/13%20Friend%20Of%20The%20Devil.mp3" },
      { title: "14 Help on The Way", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/14%20Help%20on%20The%20Way.mp3" },
      { title: "15 Tennesee", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/15%20Tennesee.mp3" },
      { title: "16 St Stephen Vocals", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/16%20St%20Stephen%20Vocals.mp3" },
      { title: "17 St Stephen", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20260825/17%20St%20Stephen.mp3" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const audioSource = document.getElementById('audio-source');
    const currentTitle = document.getElementById('current-title');
    const playlist = document.getElementById('playlist');

    let currentTrackIndex = 0;

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      audioSource.src = track.url;
      audioPlayer.load();
      currentTitle.textContent = track.title;

      // Update active styling on playlist
      const items = playlist.querySelectorAll('li');
      items.forEach((item, i) => {
        if (i === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function playTrack(index) {
      loadTrack(index);
      audioPlayer.play();
    }

    // Build the playlist elements
    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.title;
      li.addEventListener('click', () => playTrack(index));
      playlist.appendChild(li);
    });

    // Auto-play next track when current finishes
    audioPlayer.addEventListener('ended', () => {
      if (currentTrackIndex + 1 < tracks.length) {
        playTrack(currentTrackIndex + 1);
      }
    });

    // Load first track on page ready
    loadTrack(0);
  </script>
</body>
</html>
