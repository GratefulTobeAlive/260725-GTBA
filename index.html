<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTBA Rehearsal Player (260913)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">
    <header class="player-header">
      <h1>GTBA Rehearsal</h1>
      <p id="current-title">Select a track to start</p>
      
      <audio id="audio-player" controls preload="metadata">
        <source id="audio-source" src="" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </header>

    <ul class="playlist" id="playlist">
      <!-- Track items populated by JavaScript -->
    </ul>
  </div>

  <script>
    const tracks = [
      { title: "01 Mississippi Half-Step", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/01%20Mississipi%20.mp3" },
      { title: "02 Cassidy", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/02%20Cassidy.mp3" },
      { title: "04 West LA Fadeaway", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/04%20west%20LA.mp3" },
      { title: "05 Shakedown Street", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/05%20Shake%20Down.mp3" },
      { title: "07 Cats Under the Stars / Rubin & Cherise", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/07%20Cherise.mp3" },
      { title: "10 Playing in the Band", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/10%20Playin%20In%20the%20Ban.mp3" },
      { title: "12 Music Never Stopped", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/12%20Music%20Never%20Stopped.mp3" },
      { title: "13 Ship of Fools", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/13%20Ship%20Of%20Foos.mp3" },
      { title: "13 St. Stephen (Rhythm)", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/13%20St%20Stephen%20Rhythm.mp3" },
      { title: "13 St. Stephen", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/13%20St%20Stephen.mp3" },
      { title: "15 Help on the Way", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/15%20Help.mp3" },
      { title: "16 Scarlet > Fire", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/16%20scarlett%20Fire.mp3" },
      { title: "17 Sunshine Daydream (End)", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20260913/17%20Sunshne%20Daydream%20end.mp3" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const audioSource = document.getElementById('audio-source');
    const currentTitle = document.getElementById('current-title');
    const playlist = document.getElementById('playlist');

    let currentTrackIndex = 0;

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      audioSource.src = track.url;
      audioPlayer.load();
      currentTitle.textContent = track.title;

      const items = playlist.querySelectorAll('li');
      items.forEach((item, i) => {
        if (i === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function playTrack(index) {
      loadTrack(index);
      audioPlayer.play();
    }

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.title;
      li.addEventListener('click', () => playTrack(index));
      playlist.appendChild(li);
    });

    audioPlayer.addEventListener('ended', () => {
      if (currentTrackIndex + 1 < tracks.length) {
        playTrack(currentTrackIndex + 1);
      }
    });

    loadTrack(0);
  </script>
</body>
</html>
