<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTBA Rehearsal Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">
    <header class="player-header">
      <h1>GTBA Rehearsal</h1>
      <p id="current-title">Select a track to start</p>
      
      <audio id="audio-player" controls preload="metadata">
        <source id="audio-source" src="" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </header>

    <ul class="playlist" id="playlist">
      <!-- Track items populated by JavaScript -->
    </ul>
  </div>

  <script>
    const tracks = [
      { title: "01 Music Never Stopped", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/01%20Music%20Never%20Stopped.mp3" },
      { title: "02 China Rider", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/02%20China%20Rider.mp3" },
      { title: "03 Friend of The Devil", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/03%20Friend%20of%20The%20Devil.mp3" },
      { title: "04 Beat It On Down The line", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/04%20Beat%20It%20On%20Down%20The%20line.mp3" },
      { title: "04 Beat It Vox", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/04%20Beat%20It%20Vox.mp3" },
      { title: "05 Crazy Fingers Vx", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/05%20Crazy%20Fingers_Vx.mp3" },
      { title: "05 Crazy Fingers", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/05%20Crazy%20Fingers.mp3" },
      { title: "06 El Paso", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/06%20El%20Paso.mp3" },
      { title: "07 Mama Tried chrs Chords", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/07%20Mama%20Tried%20chrs%20Chords.mp3" },
      { title: "07 Mama Tried from 2nd Vs", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/07%20Mama%20Tried%20from%202nd%20Vs.mp3" },
      { title: "07 Mama Tried from chorus solo", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/07%20Mama%20Tried%20from%20chorus%20solo.mp3" },
      { title: "07 Mama Tried", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/07%20Mama%20Tried.mp3" },
      { title: "08 West La Fadeaway", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/08%20West%20La%20Fadeaway.mp3" },
      { title: "09 Cassidy", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/09%20Cassidy.mp3" },
      { title: "10 Terrapin", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/10%20Terrapin.mp3" },
      { title: "11 Playing in the Band", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/11%20playing%20in%20the%20band.mp3" },
      { title: "12 The Wheel", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/12%20The%20Wheel.mp3" },
      { title: "13 Dire Wolf", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/13%20Dire%20Wolf.mp3" },
      { title: "14 Feel Like A Stranger", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/14%20Feel%20Like%20A%20Stranger.mp3" },
      { title: "15 Dont Ease Me In", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/15%20Dont%20Ease%20Me%20In.mp3" },
      { title: "16 Ramble On Rose", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/16%20Ramble%20On%20Rose.mp3" },
      { title: "17 Terrapin Vx", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/17%20Terrepin%20Vx.mp3" },
      { title: "18 Rider Vx", url: "https://f001.backblazeb2.com/file/Flavorlab-Delivery/gfx/GTBA/GTBA%20Rehearsal%20261018/18%20Rider%20Vx.mp3" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const audioSource = document.getElementById('audio-source');
    const currentTitle = document.getElementById('current-title');
    const playlist = document.getElementById('playlist');

    let currentTrackIndex = 0;

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      audioSource.src = track.url;
      audioPlayer.load();
      currentTitle.textContent = track.title;

      const items = playlist.querySelectorAll('li');
      items.forEach((item, i) => {
        if (i === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function playTrack(index) {
      loadTrack(index);
      audioPlayer.play();
    }

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.title;
      li.addEventListener('click', () => playTrack(index));
      playlist.appendChild(li);
    });

    audioPlayer.addEventListener('ended', () => {
      if (currentTrackIndex + 1 < tracks.length) {
        playTrack(currentTrackIndex + 1);
      }
    });

    loadTrack(0);
  </script>
</body>
</html>
